name: update-duty-data

on:
  # 每周一 18:00 UTC = 北京时间周二 02:00
  schedule:
    - cron: "0 18 * * 1"
  # 国服版本更新后手动触发一次
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支或 commit（默认 master）"
        required: false
        default: master
        type: string

permissions:
  contents: write

concurrency:
  group: update-duty-data
  cancel-in-progress: false

jobs:
  build-and-publish:
    # 只在默认分支跑，避免手动在功能分支触发时把错误内容推到 Gitee
    if: github.ref_name == github.event.repository.default_branch
    # 固定 24.04：ubuntu-latest 正在往 Ubuntu 26 迁移，避免环境漂移
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 拉取上游 CSV
        run: |
          python scripts/fetch_upstream.py \
            --ref "${{ inputs.upstream_ref || 'master' }}" \
            --out vendor

      - name: 生成 JSON
        run: python scripts/build_duties.py --input vendor --out data

      - name: 提交并推送
        id: publish
        run: |
          git config user.name "duty-data-bot"
          git config user.email "duty-data-bot@users.noreply.github.com"

          git add data
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git tag "data-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin --tags
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 同步到 Gitee
        # 每次都跑：先比对 SHA，一致就跳过，不一致（含上次失败）自动补齐
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ vars.GITEE_USER }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_BRANCH: ${{ vars.GITEE_BRANCH }}
        run: bash scripts/sync_gitee.sh
