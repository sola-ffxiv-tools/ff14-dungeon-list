name: update-duty-data

on:
  # 每月 1 日 18:00 UTC = 北京时间 2 日 02:00
  schedule:
    - cron: "0 18 1 * *"
  # 国服版本更新后手动触发一次
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支或 commit（默认 master）"
        required: false
        default: master
        type: string

permissions:
  contents: write

concurrency:
  group: update-duty-data
  cancel-in-progress: false

jobs:
  build-and-publish:
    # 固定 24.04：ubuntu-latest 正在往 Ubuntu 26 迁移，避免环境漂移
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 拉取上游 CSV
        run: |
          python scripts/fetch_upstream.py \
            --ref "${{ inputs.upstream_ref || 'master' }}" \
            --out vendor

      - name: 生成 JSON
        run: python scripts/build_duties.py --input vendor --out data

      - name: 提交并推送
        id: publish
        run: |
          git config user.name "duty-data-bot"
          git config user.email "duty-data-bot@users.noreply.github.com"

          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有任何变化"
            exit 0
          fi

          # 只有 maze.json / duties.json 变了才算内容更新；只更新 status.json 的是心跳提交。
          # 心跳提交保证公共仓库 60 天内始终有活动，定时任务不会被 GitHub 自动禁用。
          if git diff --cached --quiet -- data/maze.json data/duties.json; then
            message="chore: heartbeat $(date -u +%Y-%m-%d)"
            tag=""
          else
            message="data: refresh $(date -u +%Y-%m-%d)"
            tag="data-$(date -u +%Y%m%d-%H%M%S)"
          fi

          git commit -m "$message"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          if [ -n "$tag" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 同步到 Gitee
        # 内容更新和心跳提交都会推送，保证 Gitee 镜像始终跟 GitHub 一致
        if: steps.publish.outputs.changed == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ vars.GITEE_USER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_BRANCH: ${{ vars.GITEE_BRANCH }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_USER" ] || [ -z "$GITEE_REPO" ]; then
            echo "::warning::Gitee 相关配置不完整（GITEE_TOKEN / GITEE_USER / GITEE_REPO），跳过同步"
            exit 0
          fi

          branch="${GITEE_BRANCH:-main}"
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git"
          # Gitee 侧是纯镜像：即使建仓时勾了 README/初始提交也直接覆盖
          git push --force gitee "HEAD:${branch}" --tags
